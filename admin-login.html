<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Admin Pembelajar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1528;
      --surface: #0f172a;
      --surface-soft: #15223a;
      --text: #e9eef6;
      --muted: #b8c0cc;
      --primary: #22c55e;
      --primary-ink: #052e1a;
      --ghost: #172236;
      --border: #1f2937;
      --accent: #60a5fa;
      --danger: #ef4444;
    }
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 600px at 10% -10%, var(--surface) 0%, var(--bg) 60%, var(--bg) 100%);
    }
    .login-card {
      width: min(100%, 460px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }
    .stack {
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font: inherit;
    }
    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button,
    .link-btn {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-decoration: none;
      font-weight: 700;
      font: inherit;
      cursor: pointer;
    }
    .primary {
      background: var(--primary);
      color: var(--primary-ink);
      border: 0;
    }
    .ghost,
    .link-btn {
      background: var(--ghost);
      color: var(--text);
    }
    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--muted);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .status-box.error {
      border-color: rgba(239, 68, 68, 0.55);
      color: #fecaca;
    }
    .status-box.success {
      border-color: rgba(34, 197, 94, 0.45);
      color: #bbf7d0;
    }
    .mini {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="eyebrow">Admin</div>
    <h1>Login Admin</h1>
    <p>Masuk untuk membuka fitur unggah gambar, edit data, impor data server, dan pengelolaan status saran kata.</p>
    <form id="admin-login-form" class="stack">
      <label>
        Username
        <input id="admin-username" type="text" autocomplete="username" value="admin" required>
      </label>
      <label>
        Password
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </label>
      <div class="actions">
        <button id="admin-submit" type="submit" class="primary">Masuk Admin</button>
        <button id="admin-logout" type="button" class="ghost">Logout</button>
        <a class="link-btn" href="./index.html">Kembali ke Aplikasi</a>
      </div>
    </form>
    <div id="admin-status" class="status-box">Memeriksa sesi admin...</div>
    <div id="admin-api-info" class="mini"></div>
  </main>

  <script src="./app.config.js"></script>
  <script src="./admin-login.js"></script>
</body>
</html>
