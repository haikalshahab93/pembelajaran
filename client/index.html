<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta
      name="description"
      content="Pembelajar EN-AR - aplikasi belajar bahasa Inggris dan Arab dengan kartu, kuis, frasa, dan terjemah."
    />
    <title>Pembelajar EN ↔ AR · Belajar Bahasa Inggris &amp; Arab</title>
    <script src="/app.config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema tersimpan sebelum paint pertama agar tidak berkedip.
      try {
        var saved = JSON.parse(localStorage.getItem("pembelajar_state_v2") || "{}");
        var theme = (saved.settings && saved.settings.theme) || "dark";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
